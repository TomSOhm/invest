<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 180" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="700" y2="180" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="chart-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="700" height="180" rx="16" fill="url(#bg)" stroke="#334155" stroke-width="1"/>

  <!-- Chart decoration (left side) -->
  <g transform="translate(40, 30)" opacity="0.2">
    <line x1="0" y1="30" x2="120" y2="30" stroke="#475569" stroke-width="0.5"/>
    <line x1="0" y1="60" x2="120" y2="60" stroke="#475569" stroke-width="0.5"/>
    <line x1="0" y1="90" x2="120" y2="90" stroke="#475569" stroke-width="0.5"/>
    <line x1="15" y1="25" x2="15" y2="75" stroke="#34d399" stroke-width="1.5"/>
    <rect x="10" y="35" width="10" height="25" fill="#34d399" rx="1"/>
    <line x1="35" y1="20" x2="35" y2="65" stroke="#34d399" stroke-width="1.5"/>
    <rect x="30" y="25" width="10" height="20" fill="#34d399" rx="1"/>
    <line x1="55" y1="30" x2="55" y2="80" stroke="#f87171" stroke-width="1.5"/>
    <rect x="50" y="40" width="10" height="30" fill="#f87171" rx="1"/>
    <line x1="75" y1="15" x2="75" y2="60" stroke="#34d399" stroke-width="1.5"/>
    <rect x="70" y="20" width="10" height="25" fill="#34d399" rx="1"/>
    <line x1="95" y1="10" x2="95" y2="55" stroke="#34d399" stroke-width="1.5"/>
    <rect x="90" y="15" width="10" height="20" fill="#34d399" rx="1"/>
    <line x1="115" y1="5" x2="115" y2="45" stroke="#34d399" stroke-width="1.5"/>
    <rect x="110" y="10" width="10" height="15" fill="#34d399" rx="1"/>
  </g>

  <!-- Main title -->
  <text x="350" y="72" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="42" font-weight="700" fill="#f1f5f9">
    Invest Solo
  </text>

  <!-- Accent bar -->
  <rect x="280" y="85" width="140" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Subtitle -->
  <text x="350" y="115" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#94a3b8" font-weight="400">
    Quantitative Fundamental Investment Platform
  </text>

  <!-- Tags -->
  <g transform="translate(350, 135)" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" fill="#64748b">
    <text x="-120" y="12">DCF</text>
    <text x="-120" y="12" fill="#475569" dx="28">|</text>
    <text x="-68" y="12">Graham</text>
    <text x="-68" y="12" fill="#475569" dx="48">|</text>
    <text x="0" y="12">Scoring</text>
    <text x="0" y="12" fill="#475569" dx="42">|</text>
    <text x="62" y="12">Screening</text>
    <text x="62" y="12" fill="#475569" dx="56">|</text>
    <text x="138" y="12">PEA</text>
  </g>

  <!-- Chart decoration (right side) -->
  <g transform="translate(540, 30)" opacity="0.2">
    <polyline points="0,80 20,60 40,65 60,30 80,40 100,15 120,5"
              stroke="url(#chart-line)" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="120" cy="5" r="3" fill="#38bdf8"/>
  </g>
</svg>
