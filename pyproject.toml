[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = [".", "backend", "src"]
addopts = [
    "-ra",
    "--strict-markers",
]
markers = [
    "live: tests that hit live data sources (yfinance/FMP) — opt-in via -m live",
]

[dependency-groups]
dev = [
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "loguru>=0.7",
    "numpy>=1.24.0",
    "pandas>=2.1.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.34.0",
    "yfinance>=0.2.40",
]
